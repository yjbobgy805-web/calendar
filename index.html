<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>달력</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트 (Pretendard) -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #FAF8F5;
            color: #333333;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        /* 달력에서 가로 스와이프는 월 이동 */
        #calendar-days { touch-action: pan-y; }

        /* 모바일 화면 안에 달력을 고정하고 페이지 자체 스크롤 방지 */
        @media (max-width: 640px) {
            html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; }
            body { min-height: 0 !important; padding-bottom: 0 !important; justify-content: flex-start !important; }
            body > header { flex: 0 0 auto; padding-top: 10px; padding-bottom: 10px; }
            body > main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding-bottom: 8px; }
            body > main > .calendar-grid:first-child { flex: 0 0 34px; align-items: center; font-size: 16px; margin-bottom: 6px; }
            #calendar-days { flex: 1 1 auto; min-height: 0; grid-auto-rows: minmax(0, 1fr); gap: 5px; padding: 10px; overflow: hidden; }
            #calendar-days > div { min-height: 0 !important; padding: 4px; }
            body > header button { font-size: 12px; }
            #current-month-title { font-size: 17px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-10">

    <!-- 로그인 오버레이 -->

                <h2 class="text-xl font-bold text-gray-900 mt-2">로그인</h2>
                <p class="text-xs text-gray-500 mt-1">등록된 계정으로 로그인해주세요.</p>
            </div>
            
            <div class="space-y-4">

                    <label class="block text-xs font-semibold text-gray-700 mb-1">이메일 주소</label>

                </div>
                <button id="login-submit-btn" onclick="handleLogin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition text-sm">
                    로그인하기

    <!-- Firebase SDK 및 연동 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSVJHZq98siZ9y4Tf4suwv5EL2hxQKIYk",
            authDomain: "calendar-bba90.firebaseapp.com",
            projectId: "calendar-bba90",
            storageBucket: "calendar-bba90.firebasestorage.app",
            messagingSenderId: "726651967933",
            appId: "1:726651967933:web:d481f8325a2242ea535ad4"
        };

        let app, auth, db = null;
        const appId = "calendar-bba90-work-calendar";

        window.cloudData = {
            holidays: {},
            rules: {},
            schedules: {}
        };

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            setPersistence(auth, browserSessionPersistence).catch((error) => {
                console.warn("Persistence error:", error);
            });

            onAuthStateChanged(auth, async (user) => {
                const overlay = document.getElementById('auth-overlay');
                const syncElem = document.getElementById('sync-status');
                if (user) {
                    overlay.classList.add('hidden');
                    if (syncElem) syncElem.classList.add('hidden');
                    
                    try {
                        const docRef = doc(db, "artifacts_data", appId);
                        const docSnap = await getDoc(docRef);
                        
                        if (docSnap.exists()) {
                            const firestoreData = docSnap.data() || {};
                            const savedCloudData = firestoreData.cloudData || {};

                            const oldRootSchedules = firestoreData.schedules || firestoreData.customSchedules || {};
                            const newNestedSchedules = savedCloudData.schedules || {};
                            const hasNestedSchedules = Object.keys(newNestedSchedules).length > 0;
                            const hasOldSchedules = Object.keys(oldRootSchedules).length > 0;

                            window.cloudData = {
                                ...savedCloudData,
                                holidays: savedCloudData.holidays || firestoreData.holidays || {},
                                rules: savedCloudData.rules || firestoreData.rules || {},
                                schedules: hasNestedSchedules ? newNestedSchedules :
                                    (hasOldSchedules ? oldRootSchedules : {})
                            };

                            const needsMigration = hasOldSchedules && !hasNestedSchedules;
                            if (needsMigration || !firestoreData.cloudData) {
                                await setDoc(docRef, { cloudData: window.cloudData }, { merge: true });
                            }
                        } else {
                            window.cloudData = { holidays: {}, rules: {}, schedules: {} };
                            await setDoc(docRef, { cloudData: window.cloudData }, { merge: true });
                        }
                    } catch (e) {
                        console.error("Cloud load error:", e);
                    }
                    if (typeof window.renderCalendar === 'function') {
                        window.renderCalendar();
                    }
                } else {
                    overlay.classList.remove('hidden');
                    if (syncElem) {
                        syncElem.innerText = '🔒 인증 필요';
                        syncElem.classList.remove('hidden');
                    }
                }
            });
        } catch (err) {
            document.getElementById('auth-overlay').classList.add('hidden');
        }

        window.handleLogin = async function() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorMsg = document.getElementById('auth-error-msg');

            if (!email || !password) {
                errorMsg.innerText = "이메일과 비밀번호를 모두 입력해주세요.";
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorMsg.classList.add('hidden');
                showAlert("로그인 성공!");
            } catch (error) {
                errorMsg.innerText = "로그인 실패: 이메일이나 비밀번호를 다시 확인해주세요.";
                errorMsg.classList.remove('hidden');
            }
        };

        window.handleLogout = async function() {
            if (auth) {
                try {
                    await signOut(auth);
                    showAlert("로그아웃 되었습니다.");
                } catch (e) {}
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
            }
        };

        window.saveDataToCloud = async function(newData, options = {}) {
            if (db && auth && !auth.currentUser) {
                console.error("Firebase 로그인 전 저장을 차단했습니다.");
                if (!options.silent) showAlert("로그인 상태를 확인한 뒤 다시 저장해 주세요.");
                return;
            }
            window.cloudData = newData;

            if (db) {
                try {
                    const docRef = doc(db, "artifacts_data", appId);
                    await setDoc(docRef, { cloudData: newData }, { merge: true });
                    if (!options.silent) showAlert("파이어베이스에 저장되었습니다!");
                } catch (err) {
                    console.error("Firebase save error:", err);
                    if (!options.silent) showAlert("저장 실패");
                    throw err;
                }
            } else {
                if (!options.silent) showAlert("저장되었습니다.");
            }
            if (typeof window.renderCalendar === 'function') {
                window.renderCalendar();
            }
        };

        window.manualCloudSave = function() {
            window.saveDataToCloud(window.cloudData || {});
        };

        if (typeof window.initCalendarApp === 'function') {
            window.initCalendarApp();
        }
    </script>

        };

        const publicHolidayYearCache = new Set();
        let publicHolidayMap = {};

        async function loadKoreanPublicHolidays(year) {
            if (publicHolidayYearCache.has(year)) return;

            const yearPrefix = `${year}-`;
            const yearEntries = Object.entries(holidaysAll).filter(([date]) => date.startsWith(yearPrefix));
            const existingHolidays = (window.cloudData && window.cloudData.holidays) || {};
            const mergedHolidays = { ...holidaysAll, ...existingHolidays };
            let changed = false;

            yearEntries.forEach(([date, name]) => {
                if (!Object.prototype.hasOwnProperty.call(existingHolidays, date)) {
                    mergedHolidays[date] = name;
                    changed = true;
                }
            });

            Object.entries(mergedHolidays).forEach(([date, value]) => {
                publicHolidayMap[date] = Array.isArray(value) ? value.join(', ') : String(value || '');
            });

            try {
                if (changed && typeof window.saveDataToCloud === 'function') {
                    const nextData = JSON.parse(JSON.stringify(window.cloudData || {}));
                    nextData.holidays = mergedHolidays;
                    await window.saveDataToCloud(nextData, { silent: true });
                }
                publicHolidayYearCache.add(year);

                if (currentYear === year && typeof window.renderCalendar === 'function') {
                    window.renderCalendar();
                }
            } catch (error) {
                console.error(`${year}년 공휴일 Firebase 저장 실패:`, error);
            }
        }

        function getHolidayName(dateStr) {
            const holidays = (window.cloudData && window.cloudData.holidays) || {};
            const value = holidays[dateStr] || holidaysAll[dateStr] || publicHolidayMap[dateStr] || '';
            return Array.isArray(value) ? value.join(', ') : String(value || '');
        }

        function isPublicHoliday(dateStr) {
            const holidays = (window.cloudData && window.cloudData.holidays) || {};
            return Object.prototype.hasOwnProperty.call(holidaysAll, dateStr) ||
                Object.prototype.hasOwnProperty.call(holidays, dateStr) ||
                Object.prototype.hasOwnProperty.call(publicHolidayMap, dateStr);
        }

        window.initCalendarApp = function() {
            initYearMonthDropdown();
            renderCalendar();
        };

        function initYearMonthDropdown() {
            const select = document.getElementById('year-month-select');
            if (!select) return;
            select.innerHTML = '';
            for (let y = 2026; y <= 2030; y++) {
                for (let m = 0; m < 12; m++) {
                    const opt = document.createElement('option');
                    opt.value = `${y}-${m}`;
                    opt.innerText = `${y}년 ${m + 1}월`;
                    select.appendChild(opt);
                }
            }
        }

        function getFinalSchedule(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;

            if (isPublicHoliday(dateStr)) return { '윤': [], '이': [], 'R': [], 'memo': '' };

            if (window.cloudData.schedules && window.cloudData.schedules[dateStr]) {
                return window.cloudData.schedules[dateStr];
            }
            return { '윤': [], '이': [], 'R': [], 'memo': '' };
        }

        function createBadge(workerName, type, isAlbaCustom, albaName) {
            const badge = document.createElement('div');
            badge.className = "text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded font-medium flex justify-between items-center truncate";

            let displayText = "";
            if (isAlbaCustom) {
                displayText = `${albaName} 알바`;
                badge.style.backgroundColor = '#17375D';
                badge.style.color = '#ffffff';
            } else {
                displayText = `${workerName} ${type}`;
                if (workerName === '이') {
                    if (type === '반차') {
                        badge.classList.add('bg-pink-100', 'text-pink-900');
                    } else {
                        // off, 연차, R 모두 이 off 색상과 동일하게 적용
                        badge.classList.add('bg-pink-700', 'text-white');
                    }
                } else if (workerName === '윤') {
                    if (type === '반차') {
                        badge.classList.add('bg-amber-100', 'text-amber-900');
                    } else {
                        // off, 연차, R 모두 윤 off 색상과 동일하게 적용
                        badge.style.backgroundColor = '#F79646';
                        badge.style.color = '#ffffff';
                    }
                }
            }
            badge.innerText = displayText;
            return badge;
        }

        window.renderCalendar = function() {
            loadKoreanPublicHolidays(currentYear);
            const titleElem = document.getElementById('current-month-title');
            if (titleElem) {
                titleElem.innerText = `${currentYear}. ${String(currentMonth + 1).padStart(2, '0')}.`;
            }

            const ymSelect = document.getElementById('year-month-select');
            if (ymSelect) {
                ymSelect.value = `${currentYear}-${currentMonth}`;
            }

            const container = document.getElementById('calendar-days');
            if (!container) return;
            container.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevTotalDays = new Date(currentYear, currentMonth, 0).getDate();

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                container.appendChild(createCell(prevTotalDays - i, true, null));
            }

            for (let d = 1; d <= totalDays; d++) {
                const dateObj = new Date(currentYear, currentMonth, d);
                container.appendChild(createCell(dateObj, false, false));
            }

            const totalCells = container.children.length;
            const nextDaysCount = totalCells <= 35 ? 35 - totalCells : 42 - totalCells;
            for (let d = 1; d <= nextDaysCount; d++) {
                container.appendChild(createCell(d, true, null));
            }
        };

        function createCell(dayOrDate, isOtherMonth, isPrevOrNext) {
            const cell = document.createElement('div');
            cell.className = "min-h-[85px] sm:min-h-[100px] p-1 rounded-lg sm:rounded-xl border border-gray-100 flex flex-col justify-between transition relative";

            if (isOtherMonth && (isPrevOrNext === null || typeof dayOrDate === 'number')) {
                cell.classList.add('bg-gray-50/50', 'opacity-40');
                const span = document.createElement('span');
                span.className = "text-[10px] sm:text-xs font-medium text-gray-400";
                span.innerText = dayOrDate instanceof Date ? dayOrDate.getDate() : dayOrDate;
                cell.appendChild(span);
                return cell;
            }

            const dateObj = dayOrDate;
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            const dayOfWeek = dateObj.getDay();

            const now = new Date();
            const isToday = (
                dateObj.getFullYear() === now.getFullYear() &&
                dateObj.getMonth() === now.getMonth() &&
                dateObj.getDate() === now.getDate()
            );

            const isHoliday = isPublicHoliday(dateStr);
            const holidayName = getHolidayName(dateStr);

            cell.classList.add('cursor-pointer', 'hover:bg-amber-50/30');
            cell.onclick = () => {
                if (isHoliday) return;
                openEditModal(dateStr);
            };

            const schedule = getFinalSchedule(dateObj);

            if (isHoliday) {
                cell.classList.add('bg-rose-50/70');
            } else if (isToday) {
                cell.classList.add('bg-gray-100', 'ring-2', 'ring-gray-300');
            } else {
                cell.classList.add('bg-white');
            }

            const topRow = document.createElement('div');
            topRow.className = "flex justify-between items-center text-[10px] sm:text-xs font-semibold";

            const dayNumSpan = document.createElement('span');
            dayNumSpan.innerText = dateObj.getDate();
            if (isHoliday) {
                dayNumSpan.className = "text-red-600 font-bold";
            } else if (isToday) {
                dayNumSpan.className = "bg-gray-800 text-white px-1.5 py-0.5 rounded-md font-bold text-[10px]";
            } else if (dayOfWeek === 0) {
                dayNumSpan.className = "text-red-500";
            } else if (dayOfWeek === 6) {
                dayNumSpan.className = "text-blue-500";
            } else {
                dayNumSpan.className = "text-gray-700";
            }
            topRow.appendChild(dayNumSpan);

            if (isHoliday) {
                const holidayBadge = document.createElement('span');
                holidayBadge.className = "text-[9px] bg-red-100 text-red-600 px-1 rounded truncate max-w-[65px]";
                holidayBadge.innerText = holidayName;
                topRow.appendChild(holidayBadge);
            }
            cell.appendChild(topRow);

            const contentWrapper = document.createElement('div');
            contentWrapper.className = "flex flex-col gap-0.5 mt-0.5 overflow-hidden";

            if (schedule['memo'] && schedule['memo'].trim() !== '') {
                const memoDiv = document.createElement('div');
                memoDiv.className = "text-[9px] text-indigo-700 bg-indigo-50 px-1 py-0.5 rounded truncate font-medium mb-0.5";
                memoDiv.innerText = ` ${schedule['memo']}`;
                contentWrapper.appendChild(memoDiv);
            }

            const badgesContainer = document.createElement('div');
            badgesContainer.className = "flex flex-col gap-0.5 overflow-y-auto max-h-[50px]";

            let allBadges = [];
            if (Array.isArray(schedule['윤'])) schedule['윤'].forEach(t => allBadges.push({ worker: '윤', type: t, isAlba: false }));
            if (Array.isArray(schedule['이'])) schedule['이'].forEach(t => allBadges.push({ worker: '이', type: t, isAlba: false }));
            if (schedule['R'] && Array.isArray(schedule['R'])) {
                schedule['R'].forEach(a => allBadges.push({ worker: a.name || '알바', type: '알바', isAlba: true, albaName: a.name || '알바' }));
            }

            allBadges.forEach(item => {
                badgesContainer.appendChild(createBadge(item.worker, item.type, item.isAlba, item.albaName));
            });
            contentWrapper.appendChild(badgesContainer);
            cell.appendChild(contentWrapper);

            return cell;
        }

        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        };

        window.jumpToYearMonth = function() {
            const ymSelect = document.getElementById('year-month-select');
            if (ymSelect) {
                const parts = ymSelect.value.split('-');
                currentYear = parseInt(parts[0]);
                currentMonth = parseInt(parts[1]);
                renderCalendar();
            }
        };

        window.openEditModal = function(dateStr) {
            if (isPublicHoliday(dateStr)) {
                showAlert(`${getHolidayName(dateStr)}에는 일정을 편집할 수 없습니다.`);
                return;
            }
            selectedDateStr = dateStr;
            const [y, m, d] = dateStr.split('-');
            document.getElementById('modal-date-title').innerText = `${y}년 ${m}월 ${d}일 일정 편집`;

            const dateObj = new Date(y, m - 1, d);
            const sched = getFinalSchedule(dateObj);

            const container = document.getElementById('modal-workers-container');
            container.innerHTML = '';
            container.appendChild(createWorkerEditRow('윤', sched['윤'] || []));
            container.appendChild(createWorkerEditRow('이', sched['이'] || []));

            if (sched['R'] && Array.isArray(sched['R'])) {
                sched['R'].forEach(a => container.appendChild(createAlbaEditRow(a.name || '')));
            }

            document.getElementById('modal-daily-memo').value = sched['memo'] || '';
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        function createWorkerEditRow(name, currentTypes) {
            const row = document.createElement('div');
            row.className = "flex flex-col sm:flex-row items-start sm:items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-100 gap-2";

            const leftDiv = document.createElement('div');
            const nameSpan = document.createElement('span');
            nameSpan.className = "font-bold text-gray-800 text-sm w-12";
            nameSpan.innerText = name;
            leftDiv.appendChild(nameSpan);
            row.appendChild(leftDiv);

            const btnGroup = document.createElement('div');
            btnGroup.className = "worker-buttons-group flex flex-wrap gap-1.5";

            ['반차', 'off', '연차', 'R'].forEach(opt => {
                const btn = document.createElement('button');
                btn.type = "button";
                btn.dataset.val = opt;
                btn.innerText = opt;
                updateButtonStyle(btn, currentTypes.includes(opt));
                btn.onclick = function() {
                    updateButtonStyle(btn, !btn.classList.contains('bg-gray-800'));
                };
                btnGroup.appendChild(btn);
            });

            row.appendChild(btnGroup);
            return row;
        }

        function createAlbaEditRow(albaNameVal) {
            const row = document.createElement('div');
            row.className = "flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-100 gap-2 alba-row";

            const leftDiv = document.createElement('div');
            leftDiv.className = "flex items-center gap-2";
            const nameInput = document.createElement('input');
            nameInput.type = "text";
            nameInput.value = albaNameVal;
            nameInput.className = "alba-name-input px-2.5 py-1 text-xs font-bold text-gray-800 bg-white border border-gray-200 rounded-lg w-28 focus:outline-none focus:ring-1 focus:ring-indigo-500";
            nameInput.placeholder = "알바 이름";
            leftDiv.appendChild(nameInput);
            row.appendChild(leftDiv);

            const delBtn = document.createElement('button');
            delBtn.type = "button";
            delBtn.className = "text-red-500 hover:text-red-700 text-xs font-semibold px-2 py-1 bg-red-50 rounded-lg transition";
            delBtn.innerText = "삭제";
            delBtn.onclick = () => row.remove();
            row.appendChild(delBtn);

            return row;
        }

        window.addCustomAlba = function() {
            document.getElementById('modal-workers-container').appendChild(createAlbaEditRow(''));
        };

        function updateButtonStyle(btn, isSelected) {
            if (isSelected) {
                btn.className = "px-3.5 py-2 rounded-xl text-sm font-bold bg-gray-800 text-white shadow-sm transition";
            } else {
                btn.className = "px-3.5 py-2 rounded-xl text-sm font-semibold bg-white text-gray-700 border border-gray-200 hover:bg-gray-100 transition";
            }
        }

        window.closeModal = function() {
            document.getElementById('edit-modal').classList.add('hidden');
        };

        window.saveModalChanges = function() {
            if (!selectedDateStr) return;

            const rows = document.querySelectorAll('#modal-workers-container > div');
            let yoonTypes = [], leeTypes = [], albaList = [];

            rows.forEach(row => {
                const nameElem = row.querySelector('.font-bold');
                const albaInput = row.querySelector('.alba-name-input');
                if (albaInput) {
                    if (albaInput.value.trim() !== '') albaList.push({ name: albaInput.value.trim() });
                } else if (nameElem) {
                    const activeBtns = row.querySelectorAll('.worker-buttons-group button.bg-gray-800');
                    let opts = [];
                    activeBtns.forEach(b => opts.push(b.dataset.val));
                    if (nameElem.innerText === '윤') yoonTypes = opts;
                    if (nameElem.innerText === '이') leeTypes = opts;
                }
            });

            let newCloudData = JSON.parse(JSON.stringify(window.cloudData || {}));
            if (!newCloudData.schedules) newCloudData.schedules = {};

            newCloudData.schedules[selectedDateStr] = {
                '윤': yoonTypes,
                '이': leeTypes,
                'R': albaList,
                'memo': document.getElementById('modal-daily-memo').value.trim()
            };

            closeModal();
            window.saveDataToCloud(newCloudData);
        };

        window.openStatsModal = function() {
            currentStatsMode = 'monthly';
            updateStatsTabUI();
            renderStatsContent();
            document.getElementById('stats-modal').classList.remove('hidden');
        };

        window.switchStatsTab = function(mode) {
            currentStatsMode = mode;
            updateStatsTabUI();
            renderStatsContent();
        };

        function updateStatsTabUI() {
            const mBtn = document.getElementById('tab-monthly-btn');
            const yBtn = document.getElementById('tab-yearly-btn');
            if (!mBtn || !yBtn) return;
            if (currentStatsMode === 'monthly') {
                mBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-gray-800 shadow-sm transition";
                yBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-gray-800 transition";
            } else {
                mBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-gray-800 transition";
                yBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-gray-800 shadow-sm transition";
            }
        }

        function renderStatsContent() {
            const container = document.getElementById('stats-content');
            if (!container) return;
            container.innerHTML = '';

            let stats = { 
                '윤': { '반차': 0, 'off': 0, '연차': 0, 'R': 0 }, 
                '이': { '반차': 0, 'off': 0, '연차': 0, 'R': 0 } 
            };
            let yoonLeaves = [], leeLeaves = [];
            let yoonRs = [], leeRs = [];
            let albaStats = {};

            if (currentStatsMode === 'monthly') {
                const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
                for (let d = 1; d <= totalDays; d++) {
                    let dateObj = new Date(currentYear, currentMonth, d);
                    let sched = getFinalSchedule(dateObj);

                    ['윤', '이'].forEach(w => {
                        if (Array.isArray(sched[w])) {
                            sched[w].forEach(t => {
                                if (stats[w][t] !== undefined) {
                                    stats[w][t]++;
                                    if (t === '연차') {
                                        if (w === '윤') yoonLeaves.push(`${d}일`);
                                        if (w === '이') leeLeaves.push(`${d}일`);
                                    } else if (t === 'R') {
                                        if (w === '윤') yoonRs.push(`${d}일`);
                                        if (w === '이') leeRs.push(`${d}일`);
                                    }
                                }
                            });
                        }
                    });
                }
                container.appendChild(createCombinedStatCard(`${currentYear}년 ${currentMonth + 1}월 통계`, stats, yoonLeaves, leeLeaves, yoonRs, leeRs, albaStats, false));
            } else {
                let curr = new Date(currentYear, 0, 1);
                let endDate = new Date(currentYear, 11, 31);
                while (curr <= endDate) {
                    let sched = getFinalSchedule(curr);

                    ['윤', '이'].forEach(w => {
                        if (Array.isArray(sched[w])) {
                            sched[w].forEach(t => {
                                if (stats[w][t] !== undefined) {
                                    stats[w][t]++;
                                    let dateStrFormat = `${curr.getMonth() + 1}.${curr.getDate()}`;
                                    if (t === '연차') {
                                        if (w === '윤') yoonLeaves.push(dateStrFormat);
                                        if (w === '이') leeLeaves.push(dateStrFormat);
                                    } else if (t === 'R') {
                                        if (w === '윤') yoonRs.push(dateStrFormat);
                                        if (w === '이') leeRs.push(dateStrFormat);
                                    }
                                }
                            });
                        }
                    });

                    if (sched['R'] && Array.isArray(sched['R'])) {
                        sched['R'].forEach(a => {
                            let aName = (a.name || '알바').trim();
                            if (!aName) return;
                            if (!albaStats[aName]) {
                                albaStats[aName] = { count: 0, dates: [] };
                            }
                            albaStats[aName].count++;
                            albaStats[aName].dates.push(`${curr.getMonth() + 1}.${curr.getDate()}`);
                        });
                    }
                    curr.setDate(curr.getDate() + 1);
                }
                container.appendChild(createCombinedStatCard(`${currentYear}년 전체 1년 통계`, stats, yoonLeaves, leeLeaves, yoonRs, leeRs, albaStats, true));
            }
        }

        function createCombinedStatCard(title, stats, yoonLeaves, leeLeaves, yoonRs, leeRs, albaStats, isYearly) {
            const card = document.createElement('div');
            card.className = "bg-gray-50 p-4 rounded-2xl border border-gray-100 space-y-3";
            let yoonLeaveStr = yoonLeaves.length > 0 ? `${yoonLeaves.length}일 (${yoonLeaves.join(', ')})` : '0일';
            let leeLeaveStr = leeLeaves.length > 0 ? `${leeLeaves.length}일 (${leeLeaves.join(', ')})` : '0일';
            let yoonRStr = yoonRs.length > 0 ? `${yoonRs.length}일 (${yoonRs.join(', ')})` : '0일';
            let leeRStr = leeRs.length > 0 ? `${leeRs.length}일 (${leeRs.join(', ')})` : '0일';

            let yoonExtraHtml = `
                <div class="text-[11px] text-gray-600 pt-1.5 border-t border-gray-50 space-y-1">
                    <div><span class="font-semibold text-green-700">R:</span> ${yoonRStr}</div>
                    <div><span class="font-semibold text-purple-700">연차:</span> ${yoonLeaveStr}</div>
                </div>
            `;

            let leeExtraHtml = `
                <div class="text-[11px] text-gray-600 pt-1.5 border-t border-gray-50 space-y-1">
                    <div><span class="font-semibold text-green-700">R:</span> ${leeRStr}</div>
                    <div><span class="font-semibold text-purple-700">연차:</span> ${leeLeaveStr}</div>
                </div>
            `;

            let albaCardHtml = '';
            if (isYearly) {
                let albaKeys = Object.keys(albaStats || {});
                if (albaKeys.length > 0) {
                    let albaItemsHtml = albaKeys.map(name => {
                        let info = albaStats[name];
                        let dateStr = info.dates.join(', ');
                        return `
                            <div class="flex justify-between items-center py-1.5 border-b border-gray-100 last:border-b-0 text-xs">
                                <span class="font-bold text-indigo-900">👤 ${name}</span>
                                <span class="text-gray-600"><strong class="text-indigo-600">${info.count}일</strong> <span class="text-[10px] text-gray-400">(${dateStr})</span></span>
                            </div>
                        `;
                    }).join('');

                    albaCardHtml = `
                        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 space-y-2">
                            <div class="text-xs font-bold text-indigo-700 mb-1">🤝 알바 근무 현황</div>
                            <div class="space-y-1">
                                ${albaItemsHtml}
                            </div>
                        </div>
                    `;
                } else {
                    albaCardHtml = `
                        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-center text-xs text-gray-400 py-2">
                            등록된 알바 근무 기록이 없습니다.
                        </div>
                    `;
                }
            }

            card.innerHTML = `
                <h4 class="font-bold text-gray-800 text-sm mb-1">${title}</h4>
                <div class="space-y-2">
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 space-y-2">
                        <div class="text-xs font-bold text-amber-700 mb-1">근무자: 윤</div>
                        <div class="grid grid-cols-4 gap-1 text-center">
                            <div><div class="text-[10px] text-gray-400">반차</div><div class="text-xs font-bold text-amber-600">${stats['윤']['반차']}</div></div>
                            <div><div class="text-[10px] text-gray-400">off</div><div class="text-xs font-bold text-rose-600">${stats['윤']['off']}</div></div>
                            <div><div class="text-[10px] text-gray-400">연차</div><div class="text-xs font-bold text-purple-600">${stats['윤']['연차']}</div></div>
                            <div><div class="text-[10px] text-gray-400">R</div><div class="text-xs font-bold text-green-600">${stats['윤']['R']}</div></div>
                        </div>
                        ${yoonExtraHtml}
                    </div>
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 space-y-2">
                        <div class="text-xs font-bold text-pink-700 mb-1">근무자: 이</div>
                        <div class="grid grid-cols-4 gap-1 text-center">
                            <div><div class="text-[10px] text-gray-400">반차</div><div class="text-xs font-bold text-amber-600">${stats['이']['반차']}</div></div>
                            <div><div class="text-[10px] text-gray-400">off</div><div class="text-xs font-bold text-rose-600">${stats['이']['off']}</div></div>
                            <div><div class="text-[10px] text-gray-400">연차</div><div class="text-xs font-bold text-purple-600">${stats['이']['연차']}</div></div>
                            <div><div class="text-[10px] text-gray-400">R</div><div class="text-xs font-bold text-green-600">${stats['이']['R']}</div></div>
                        </div>
                        ${leeExtraHtml}
                    </div>
                    ${albaCardHtml}
                </div>
            `;
            return card;
        }

        window.closeStatsModal = function() {
            document.getElementById('stats-modal').classList.add('hidden');
        };

        function showAlert(msg) {
            const alertBox = document.getElementById('alert-box');
            if (!alertBox) return;
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 2500);
        }

        (function enableCalendarSwipe() {
            const calendar = document.getElementById('calendar-days');
            if (!calendar) return;
            let startX = 0;
            let startY = 0;
            let tracking = false;
            calendar.addEventListener('touchstart', function (event) {
                if (event.touches.length !== 1) { tracking = false; return; }
                const target = event.target;
                if (target.closest('button, input, select, textarea, a')) { tracking = false; return; }
                startX = event.touches[0].clientX;
                startY = event.touches[0].clientY;
                tracking = true;
            }, { passive: true });
            calendar.addEventListener('touchend', function (event) {
                if (!tracking || !event.changedTouches.length) return;
                tracking = false;
                const modalOpen = ['edit-modal', 'stats-modal'].some(id => {
                    const el = document.getElementById(id);
                    return el && !el.classList.contains('hidden');
                });
                if (modalOpen) return;
                const dx = event.changedTouches[0].clientX - startX;
                const dy = event.changedTouches[0].clientY - startY;
                if (Math.abs(dx) >= 55 && Math.abs(dx) > Math.abs(dy) * 1.25) {
                    window.changeMonth(dx < 0 ? 1 : -1);
                }
            }, { passive: true });
            calendar.addEventListener('touchcancel', function () { tracking = false; }, { passive: true });
        })();
    </script>
</body>
